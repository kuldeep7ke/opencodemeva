name: build-installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          & .\installer\windows\build.ps1
          Get-ChildItem -Force installer\dist | Select-Object Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencodemeva-patch-windows
          path: |
            installer/dist/*.exe
            installer/dist/SHA256SUMS.txt

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build .deb
        run: |
          chmod +x installer/linux/build-deb.sh
          ./installer/linux/build-deb.sh

      - name: Inspect .deb
        run: |
          dpkg-deb --info installer/dist/*.deb
          dpkg-deb --contents installer/dist/*.deb | head -40

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencodemeva-patch-linux
          path: |
            installer/dist/*.deb
            installer/dist/SHA256SUMS.txt